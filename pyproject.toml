[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-foundry"
version = "0.1.0"
description = "Test-automation framework for pytest suites: layered configuration, HTTP/API helpers, contract validation, data-driven cases, record/replay, retries with quarantine, sharding, artifact capture and reporting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Typing :: Typed",
]
dependencies = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<0.28",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "click>=8.1,<9",
  "rich>=13.7,<14",
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0.1,<7",
  "jsonschema>=4.22,<5",
  "Faker>=25,<26",
  "SQLAlchemy>=2.0.30,<2.1",
  "pytest-xdist>=3.6,<4",
  "pytest-timeout>=2.3,<3",
  "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pytest-cov>=5,<6",
  "types-PyYAML",
  "types-jsonschema",
  "types-toml",
  "build>=1.2",
]

[project.scripts]
foundry = "foundry.cli.main:main"

[project.entry-points.pytest11]
foundry = "foundry.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.hatch.build.targets.sdist]
include = [
  "src/foundry",
  "tests",
  "examples",
  "scripts",
  "docs",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  ".gitignore",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"**/__init__.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
